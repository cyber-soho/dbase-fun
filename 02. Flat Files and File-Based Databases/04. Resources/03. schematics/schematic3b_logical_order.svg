<svg id='sch3b' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 560' width='1200' height='560' role='img' aria-label='Written order and logical processing order'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#0E7C7B'/></marker><marker id='ahr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#B5440C'/></marker><marker id='aha' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#E0A106'/></marker><marker id='ahm' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6B6560'/></marker><marker id='aho' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#0d8a6a'/></marker><marker id='ahk' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#d03b3b'/></marker></defs><rect width='1200' height='560' fill='#ffffff'/><text x='20' y='34' font-size='21' fill='#0E7C7B' font-weight='bold' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>Schematic 3b — Written order and logical processing order</text><text x='20' y='57' font-size='12.5' fill='#6B6560' font-weight='normal' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>You write SELECT first, but the database processes FROM first. The logical order explains where an alias can be used.</text><text x='30' y='112' font-size='15' fill='#1C1917' font-weight='bold' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>Written order</text><rect x='200' y='86' width='150' height='40' rx='8' fill='#fff' stroke='#0E7C7B' stroke-width='2'/><text x='275' y='112' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>SELECT</text><rect x='390' y='86' width='150' height='40' rx='8' fill='#fff' stroke='#0E7C7B' stroke-width='2'/><text x='465' y='112' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>FROM</text><rect x='580' y='86' width='150' height='40' rx='8' fill='#fff' stroke='#0E7C7B' stroke-width='2'/><text x='655' y='112' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>WHERE</text><rect x='770' y='86' width='150' height='40' rx='8' fill='#fff' stroke='#0E7C7B' stroke-width='2'/><text x='845' y='112' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>ORDER BY</text><rect x='960' y='86' width='150' height='40' rx='8' fill='#fff' stroke='#0E7C7B' stroke-width='2'/><text x='1035' y='112' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>LIMIT</text><text x='30' y='272' font-size='15' fill='#1C1917' font-weight='bold' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>Logical order</text><rect x='160' y='246' width='140' height='40' rx='8' fill='#E4F2F1' stroke='#0E7C7B' stroke-width='2'/><text x='230' y='272' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>FROM</text><text x='230' y='306' font-size='11.5' fill='#6B6560' font-weight='normal' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>1 · which table?</text><line x1='302' y1='266' x2='326' y2='266' stroke='#0E7C7B' stroke-width='2' marker-end='url(#ah)'/><rect x='328' y='246' width='140' height='40' rx='8' fill='#E4F2F1' stroke='#0E7C7B' stroke-width='2'/><text x='398' y='272' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>WHERE</text><text x='398' y='306' font-size='11.5' fill='#6B6560' font-weight='normal' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>2 · which rows?</text><line x1='470' y1='266' x2='494' y2='266' stroke='#0E7C7B' stroke-width='2' marker-end='url(#ah)'/><rect x='496' y='246' width='140' height='40' rx='8' fill='#E4F2F1' stroke='#0E7C7B' stroke-width='2'/><text x='566' y='272' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>SELECT</text><text x='566' y='306' font-size='11.5' fill='#6B6560' font-weight='normal' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>3 · which columns?</text><line x1='638' y1='266' x2='662' y2='266' stroke='#0E7C7B' stroke-width='2' marker-end='url(#ah)'/><rect x='664' y='246' width='140' height='40' rx='8' fill='#FFF3CD' stroke='#0E7C7B' stroke-width='2'/><text x='734' y='272' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>DISTINCT</text><text x='734' y='306' font-size='11.5' fill='#6B6560' font-weight='normal' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>4 · remove duplicates</text><line x1='806' y1='266' x2='830' y2='266' stroke='#0E7C7B' stroke-width='2' marker-end='url(#ah)'/><rect x='832' y='246' width='140' height='40' rx='8' fill='#E4F2F1' stroke='#0E7C7B' stroke-width='2'/><text x='902' y='272' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>ORDER BY</text><text x='902' y='306' font-size='11.5' fill='#6B6560' font-weight='normal' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>5 · in what order?</text><line x1='974' y1='266' x2='998' y2='266' stroke='#0E7C7B' stroke-width='2' marker-end='url(#ah)'/><rect x='1000' y='246' width='140' height='40' rx='8' fill='#E4F2F1' stroke='#0E7C7B' stroke-width='2'/><text x='1070' y='272' font-size='15' fill='#0A5F5E' font-weight='bold' text-anchor='middle' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>LIMIT</text><text x='1070' y='306' font-size='11.5' fill='#6B6560' font-weight='normal' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>6 · how many?</text><line x1='275' y1='128' x2='566' y2='242' stroke='#6B6560' stroke-width='1.4' marker-end='url(#ahm)' stroke-dasharray='5 4'/><line x1='465' y1='128' x2='230' y2='242' stroke='#6B6560' stroke-width='1.4' marker-end='url(#ahm)' stroke-dasharray='5 4'/><line x1='655' y1='128' x2='398' y2='242' stroke='#6B6560' stroke-width='1.4' marker-end='url(#ahm)' stroke-dasharray='5 4'/><line x1='845' y1='128' x2='902' y2='242' stroke='#6B6560' stroke-width='1.4' marker-end='url(#ahm)' stroke-dasharray='5 4'/><line x1='1035' y1='128' x2='1070' y2='242' stroke='#6B6560' stroke-width='1.4' marker-end='url(#ahm)' stroke-dasharray='5 4'/><rect x='30' y='340' width='560' height='152' rx='10' fill='#FBE9E9' stroke='#d03b3b' stroke-width='1.6'/><text x='46' y='366' font-size='15' fill='#d03b3b' font-weight='bold' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>WHERE runs before SELECT (standard SQL)</text><text x='46' y='390' font-size='13' fill='#1C1917' font-weight='normal' text-anchor='start' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>… WHERE line_total &gt; 10</text><text x='46' y='410' font-size='12.5' fill='#1C1917' font-weight='normal' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>PostgreSQL / SQL Server: error — line_total does not exist yet.</text><text x='46' y='430' font-size='12.5' fill='#1C1917' font-weight='normal' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>DuckDB and SQLite accept it as an extension: not portable.</text><text x='46' y='454' font-size='12.5' fill='#1C1917' font-weight='normal' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>Portable form — repeat the expression:</text><text x='46' y='476' font-size='13' fill='#0d8a6a' font-weight='bold' text-anchor='start' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>… WHERE unit_price * quantity &gt; 10</text><rect x='610' y='340' width='570' height='150' rx='10' fill='#E2F4EE' stroke='#0d8a6a' stroke-width='1.6'/><text x='626' y='368' font-size='15' fill='#0d8a6a' font-weight='bold' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>ORDER BY runs after SELECT</text><text x='626' y='394' font-size='13' fill='#1C1917' font-weight='normal' text-anchor='start' font-family='DejaVu Sans Mono, Consolas, Menlo, monospace'>… ORDER BY line_total DESC   →  works everywhere:</text><text x='626' y='414' font-size='13' fill='#1C1917' font-weight='normal' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>the alias was created by SELECT one step earlier.</text><text x='626' y='440' font-size='13' fill='#1C1917' font-weight='normal' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>LIMIT comes last: it cuts the sorted result,</text><text x='626' y='462' font-size='13' fill='#1C1917' font-weight='normal' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>so without ORDER BY it returns any n rows.</text><text x='30' y='520' font-size='12.5' fill='#6B6560' font-weight='normal' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>Class 6 adds GROUP BY and HAVING between WHERE and SELECT: FROM → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT.</text><text x='20' y='546' font-size='11' fill='#6B6560' font-weight='normal' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif'>IT 505 · Class 2 (Tue 24 Nov 2026) · © 2026 Cyber.SoHo / Asen Grozdanov — educational material · fictional data (Mercadillo 505)</text></svg>